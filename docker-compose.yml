services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: nihongo_db
      MYSQL_USER: nihongo_user
      MYSQL_PASSWORD: ${DB_PASSWORD:-1234}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootchangeme}
      TZ: Asia/Ho_Chi_Minh # Đồng bộ múi giờ Việt Nam
    # Ép MySQL sử dụng chuẩn UTF-8 hỗ trợ Emoji và tiếng Nhật
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci 
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootchangeme}"]
      interval: 5s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:5
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "8085:80"
    depends_on:
      - db

volumes:
  db_data: